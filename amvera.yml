# Конфигурация развёртывания на Amvera (кластер Варшава).
# Сборка идёт по нашему Dockerfile; сервис — бот MAX + планировщик,
# плюс лёгкий health-эндпоинт на containerPort (его проверяет Amvera).
#
# Секреты (LERS_API_KEY, LERS_PASSWORD, MAX_BOT_TOKEN, доступы к 1С) задаются
# в панели Amvera → «Переменные окружения», а НЕ в этом файле и НЕ в git.
meta:
  environment: docker
  toolchain:
    name: docker
build:
  dockerfile: Dockerfile
run:
  # Постоянный том: SQLite-состояние и готовые отчёты переживают пересборку.
  persistenceMount: /data
  # Health-сервер приложения слушает этот порт (Amvera проверяет доступность).
  containerPort: 80
